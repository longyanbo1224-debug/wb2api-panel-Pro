# Pinned Gradle version for the mobile project.
#
# The wrapper (gradlew / gradlew.bat / gradle-wrapper.jar) is generated by
# running "gradle wrapper" inside mobile\ (or by opening mobile\ in Android
# Studio once). Keeping this file in the repo means that generation always
# pins the same version and downloads it from the same mirror.
#
# 8.7 is the version tested with AGP 8.5.2 (see ../build.gradle).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
