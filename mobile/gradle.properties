# Gradle / AGP 基础开关。
# 内存别给太大：Android 构建在小内存机器上容易 OOM，2G 足够本工程（无 AndroidX、无第三方依赖）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 本工程刻意不引入 AndroidX/AppCompat：只用 framework 的 Activity + WebView，
# 好处是打包时不额外拉依赖、安装包小、离线也能构建（只需 AGP 本体）。
android.useAndroidX=false
android.nonTransitiveRClass=true

# 网络超时：不加这两条，依赖源不可达时 Gradle 会静默等几分钟到几十分钟（看起来像卡死）。
# 给个明确上限，失败就直接报错，好判断是网络问题还是构建问题。
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
